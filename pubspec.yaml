name: widgets_easier_workspace
description: Monorepo for the Widgets Easier component library.
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - packages/widgets_easier
  - packages/widgets_easier/example
  - packages/widgets_easier_privacy_guard
  - packages/widgets_easier_privacy_guard/example

dev_dependencies:
  melos: ^8.8.0

melos:
  repository: https://github.com/jacklee1995/widgets_easier

  command:
    version:
      # All packages share one version number and are released together.
      linkToCommits: true
      workspaceChangelog: true

  scripts:
    analyze:
      run: dart analyze --fatal-infos .
      description: Static analysis for every package in the workspace.

    format:
      run: dart format --set-exit-if-changed .
      description: Verify formatting (fails if any file would change).

    format:fix:
      run: dart format .
      description: Format every package in place.

    test:
      exec: flutter test
      packageFilters:
        dirExists: test
      description: Run unit / widget tests of every publishable package.

    publish:dry:
      exec: dart pub publish --dry-run
      packageFilters:
        noPrivate: true
      description: Publish dry-run for every publishable package.

    outdated:
      exec: dart pub outdated
      description: List outdated dependencies for every package.
